name: Daily Content Publish

on:
  schedule:
    # GitHub Actions usa SEMPRE UTC e non gestisce l'ora legale.
    # Pubblichiamo 3 volte al giorno nei picchi di engagement USA:
    # 9:00, 12:00 e 19:00 America/New_York. Per ogni orario lanciamo a
    # entrambe le ore UTC possibili (EDT = UTC-4, EST = UTC-5) e lo step
    # "guard" fa proseguire solo quando a New York e' l'ora giusta.
    - cron: "0 13 * * *" # 9:00 NY in ora legale (EDT)
    - cron: "0 14 * * *" # 9:00 NY in ora solare (EST)
    - cron: "0 16 * * *" # 12:00 NY in ora legale (EDT)
    - cron: "0 17 * * *" # 12:00 NY in ora solare (EST)
    - cron: "0 23 * * *" # 19:00 NY in ora legale (EDT)
    - cron: "0 0 * * *"  # 19:00 NY in ora solare (EST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegui in modalità dry-run (nessuna pubblicazione, storico non aggiornato)"
        type: boolean
        default: false

# Necessario per poter committare l'aggiornamento di data/history.json.
permissions:
  contents: write

concurrency:
  group: daily-content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sulle esecuzioni schedulate procede solo negli orari di punta di
      # New York (9:00, 12:00, 19:00). Sulle esecuzioni manuali
      # (workflow_dispatch) non gira e non blocca nulla.
      - name: Guard orari di punta America/New_York
        if: ${{ github.event_name == 'schedule' }}
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "Ora attuale a New York: ${HOUR}:00"
          case "$HOUR" in
            09|12|19)
              echo "Orario di punta: procedo con la pubblicazione." ;;
            *)
              echo "Non e' un orario di punta a New York: salto questa esecuzione."
              echo "SKIP=true" >> "$GITHUB_ENV" ;;
          esac

      - name: Setup Node.js
        if: ${{ env.SKIP != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: ${{ env.SKIP != 'true' }}
        run: npm ci

      - name: Run content engine
        if: ${{ env.SKIP != 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_GID: ${{ secrets.GOOGLE_SHEET_GID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOG_LEVEL: info
        run: npm start

      - name: Commit updated history
        if: ${{ env.SKIP != 'true' && inputs.dry_run != true }}
        run: |
          if [[ -z "$(git status --porcelain data/history.json)" ]]; then
            echo "Nessuna modifica allo storico da committare."
            exit 0
          fi
          git config user.name "jag-content-bot"
          git config user.email "actions@github.com"
          branch="${GITHUB_REF_NAME}"
          git add data/history.json
          git commit -m "chore: update publication history [skip ci]"
          # Push resiliente: se il branch remoto è avanzato, riallinea e riprova.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Storico aggiornato (tentativo ${attempt})."
              exit 0
            fi
            echo "Push respinto: riallineo a origin/${branch} e riprovo..."
            git fetch origin "${branch}"
            git rebase "origin/${branch}" || git rebase --abort
            sleep 2
          done
          echo "::error::Impossibile salvare lo storico dopo diversi tentativi."
          exit 1
