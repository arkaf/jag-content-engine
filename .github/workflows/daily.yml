name: Daily Content Publish

on:
  schedule:
    # GitHub Actions usa UTC e fa partire i cron spesso in ritardo (anche 1-2h).
    # Per questo NON ci affidiamo all'ora esatta: il motore decide in base a
    # FINESTRE orarie (America/New_York) con idempotenza (1 post per slot al
    # giorno). Qui lanciamo vicino all'INIZIO di ogni finestra, in entrambi gli
    # offset EDT (UTC-4) ed EST (UTC-5), così un eventuale ritardo cade comunque
    # dentro la finestra.
    - cron: "0 12 * * *" # ~inizio finestra mattina (08:00 NY, EDT)
    - cron: "0 13 * * *" # ~inizio finestra mattina (08:00 NY, EST)
    - cron: "0 16 * * *" # ~inizio finestra pranzo (12:00 NY, EDT)
    - cron: "0 17 * * *" # ~inizio finestra pranzo (12:00 NY, EST)
    - cron: "0 22 * * *" # ~inizio finestra sera (18:00 NY, EDT)
    - cron: "0 23 * * *" # ~inizio finestra sera (18:00 NY, EST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegui in modalità dry-run (nessuna pubblicazione, storico non aggiornato)"
        type: boolean
        default: false
      product:
        description: "Prodotto specifico da pubblicare: link, ID o parte del nome. Vuoto = selezione automatica"
        type: string
        default: ""
      format:
        description: "Formato editoriale del post"
        type: choice
        default: "auto"
        options:
          - auto
          - product_of_the_day
          - todays_pick
          - how_to_style_it
          - brand_spotlight
          - best_value_find
          - accessory_of_the_week

# Necessario per poter committare l'aggiornamento di data/history.json.
permissions:
  contents: write

concurrency:
  group: daily-content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lo storico vive sul branch dedicato "data" (solo dati, nessun codice):
      # cosi' il bot non committa mai su main e i branch non divergono.
      - name: Load publication history
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            # Se il file non fosse leggibile il job fallisce (set -e): meglio
            # fermarsi che pubblicare con uno storico vuoto e fare doppioni.
            git show FETCH_HEAD:history.json > data/history.json
            echo "Storico caricato dal branch data ($(grep -c '"id"' data/history.json) pubblicazioni)."
          else
            echo "::warning::Branch 'data' assente: parto con storico vuoto (primo avvio)."
            echo '{"version":1,"published":[]}' > data/history.json
          fi

      # Il motore decide da solo se pubblicare: sui run schedulati applica il
      # gating per slot/finestra (America/New_York) con idempotenza; sui run
      # manuali pubblica sempre. RUN_MODE distingue i due casi.
      - name: Run content engine
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_GID: ${{ secrets.GOOGLE_SHEET_GID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_PINTEREST_ACCOUNT_ID: ${{ secrets.ZERNIO_PINTEREST_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_PRODUCT: ${{ inputs.product }}
          FORCE_FORMAT: ${{ inputs.format }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          LOG_LEVEL: info
        run: npm start

      # Salva lo storico sul branch "data" costruendo il commit con i comandi
      # di basso livello: non tocca la working tree e non serve un checkout
      # separato. In caso di corsa con un altro run, rifa' il commit sul nuovo
      # tip e riprova.
      - name: Save publication history
        if: ${{ inputs.dry_run != true }}
        env:
          GIT_AUTHOR_NAME: jag-content-bot
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: jag-content-bot
          GIT_COMMITTER_EMAIL: actions@github.com
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            parent=$(git rev-parse FETCH_HEAD)
            if [[ "$(git show "${parent}:history.json" 2>/dev/null)" == "$(cat data/history.json)" ]]; then
              echo "Nessuna modifica allo storico da salvare."
              exit 0
            fi
            blob=$(git hash-object -w data/history.json)
            tree=$(printf '100644 blob %s\thistory.json\n' "$blob" | git mktree)
            commit=$(git commit-tree "$tree" -p "$parent" -m "chore: update publication history")
            if git push origin "${commit}:refs/heads/data"; then
              echo "Storico aggiornato sul branch data (tentativo ${attempt})."
              exit 0
            fi
            echo "Push respinto (un altro run ha scritto prima): riprovo..."
            sleep 2
          done
          echo "::error::Impossibile salvare lo storico dopo diversi tentativi."
          exit 1
